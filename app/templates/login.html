<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in &middot; ClusterKeep</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f4;
    --card: #ffffff;
    --fg: #1c1917;
    --muted: #78716c;
    --border: #d6d3d1;
    --accent: #b45309;
    --accent-fg: #ffffff;
    --error-bg: #fef2f2;
    --error-fg: #991b1b;
    --error-border: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --card: #292524;
      --fg: #f5f5f4;
      --muted: #a8a29e;
      --border: #44403c;
      --accent: #d97706;
      --accent-fg: #1c1917;
      --error-bg: #450a0a;
      --error-fg: #fecaca;
      --error-border: #7f1d1d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg); padding: 1.5rem;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 24rem; background: var(--card); border: 1px solid var(--border);
    border-radius: 0.75rem; padding: 2rem; box-shadow: 0 1px 3px rgb(0 0 0 / 0.1);
  }
  h1 { margin: 0 0 0.25rem; font-size: 1.5rem; letter-spacing: -0.02em; }
  .sub { margin: 0 0 1.5rem; color: var(--muted); font-size: 0.875rem; }
  label { display: block; font-size: 0.8125rem; font-weight: 600; margin-bottom: 0.375rem; }
  input {
    width: 100%; padding: 0.625rem 0.75rem; margin-bottom: 1rem; font-size: 0.9375rem;
    border: 1px solid var(--border); border-radius: 0.5rem; background: var(--bg); color: var(--fg);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; padding: 0.625rem 0.75rem; font-size: 0.9375rem; font-weight: 600; cursor: pointer;
    border: 0; border-radius: 0.5rem; background: var(--accent); color: var(--accent-fg);
  }
  button:hover { filter: brightness(1.08); }
  .error {
    background: var(--error-bg); color: var(--error-fg); border: 1px solid var(--error-border);
    border-radius: 0.5rem; padding: 0.625rem 0.75rem; margin-bottom: 1rem; font-size: 0.875rem;
  }
  .env { display: inline-block; margin-top: 1.25rem; color: var(--muted); font-size: 0.75rem; }
</style>
</head>
<body>
<main class="card">
  <h1>ClusterKeep</h1>
  <p class="sub">Sign in to continue.</p>

  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}

  <form method="post" action="/login" autocomplete="on">
    <input type="hidden" name="next" value="{{ next }}">

    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit">Sign in</button>
  </form>

  <span class="env">{{ environment }}</span>
</main>
</body>
</html>
